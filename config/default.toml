# Codegen overrides for default.xex (Tenchu Z, Title ID 465307D7).
# Included from tenchuz_manifest.toml -> [entrypoint].includes.
# Disassemble with tools/dis.sh <start> <stop> to verify any entry here.

# MSVC CRT setjmp/longjmp, redirected to host implementations.
# setjmp: mfcr r4 ; stfd f14,0(r3) ... (optional hook via fn ptr at 0x8341B14C)
setjmp_address = 0x82657B00
# longjmp: restores f14-f31 / r13-r31 from jmp_buf, calls RtlUnwind
longjmp_address = 0x826578C0

# Register-local codegen options (ctr/xer/cr/non_volatile/non_argument_as_local,
# skip_msr) were tried on 2026-10-20 and are off: skip_msr and
# non_argument_as_local hang the first loading screen, and the remaining set
# corrupts the software WMV decoder (intro and mission movies turn into purple
# and green stripes), for only ~4% less main-thread time in Mission 1. Bisect
# them per option (and per function, with share_registers) before trying again.

# Functions with no .pdata entry that are only reached via tail branches.
[functions]
# C++ this-adjustor thunk: addi r3,r3,4 ; b 0x82516B10
0x8251F828 = { size = 0x8 }
# Leaf: increments refcount at this+8 (AddRef-style), reached from thunk 0x825164A0
0x82515C50 = { size = 0x14 }
# Leaf: stores 3 vtable pointers (ctor/dtor body), reached from thunk 0x82515C48
0x825164A8 = { size = 0x28 }
# Leaf FP math routine (fabs/fsel core, r4 = mode flag), reached from 0x82655E60
0x82655CA0 = { size = 0xF4 }

# Native renderer (N3): right after D3D Swap calls VdSwap. r29 + 4 is the
# 64-dword ring block VdSwap filled; the hook NOPs the emulator's swap packet
# while native output is on (src/renderer/native_renderer.cpp).
[[midasm_hook]]
name = "TenchuzAfterVdSwap"
address = 0x8241C0E0
registers = ["r29"]
